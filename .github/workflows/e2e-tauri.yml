name: E2E Tauri (WebdriverIO)

on:
  push:
    branches:
      - 'release/**'
      - develop
  pull_request:
    branches:
      - 'release/**'

jobs:
  e2e-tauri:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb \
            sqlite3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (release)
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install e2e-tauri deps
        run: cd e2e-tauri && npm ci

      - name: Run WebdriverIO smoke tests
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          export TAURI_APP_BINARY=$PWD/src-tauri/target/release/myhealth
          cd e2e-tauri && npm test
        env:
          MYHEALTH_TEST_DB: ${{ github.workspace }}/src-tauri/tests/fixtures/test.db
