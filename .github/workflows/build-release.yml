name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build — ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: myHealth_aarch64.dmg
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: myHealth_x86_64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: myHealth_x86_64.msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: myHealth_x86_64.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            tesseract-ocr \
            poppler-utils

      - name: Stage sidecar binaries (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          cp "$(which tesseract)" src-tauri/binaries/tesseract-x86_64-unknown-linux-gnu
          cp "$(which pdftoppm)"  src-tauri/binaries/pdftoppm-x86_64-unknown-linux-gnu

      - name: Stage sidecar binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract poppler
          mkdir -p src-tauri/binaries
          cp "$(which tesseract)" "src-tauri/binaries/tesseract-${{ matrix.target }}"
          cp "$(which pdftoppm)"  "src-tauri/binaries/pdftoppm-${{ matrix.target }}"

      - name: Stage sidecar binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes
          choco install poppler --yes
          $tess = Get-ChildItem "C:\Program Files\Tesseract-OCR\tesseract.exe" -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName -First 1
          if (-not $tess) { $tess = (Get-Command tesseract).Source }
          $ppm  = Get-ChildItem "C:\ProgramData\chocolatey\lib\poppler\tools\bin\pdftoppm.exe" -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName -First 1
          if (-not $ppm) { $ppm = (Get-Command pdftoppm).Source }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $tess "src-tauri/binaries/tesseract-${{ matrix.target }}.exe"
          Copy-Item $ppm  "src-tauri/binaries/pdftoppm-${{ matrix.target }}.exe"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: myHealth ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Install myHealth ${{ github.ref_name }}

            | Platform | Download |
            |----------|---------|
            | macOS (Apple Silicon) | `myHealth_aarch64.dmg` |
            | macOS (Intel) | `myHealth_x86_64.dmg` |
            | Windows | `myHealth_x86_64.msi` |
            | Linux | `myHealth_x86_64.AppImage` |

            ### macOS note
            The app is not notarised. After downloading, right-click the `.dmg` → Open to bypass Gatekeeper on first launch.

            ### Linux note
            Make the AppImage executable before running:
            ```bash
            chmod +x myHealth_x86_64.AppImage
            ./myHealth_x86_64.AppImage
            ```

          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
