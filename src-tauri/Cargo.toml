[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
regex = "1"
strsim = "0.11"
pdf-extract = "0.7"
image = "0.25"
tokio = { version = "1", features = ["process", "time", "rt", "rt-multi-thread", "macros"] }
zeroize = "1"
icalendar = "0.17"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
mockito = "1.4"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

[lints.rust]
# objc 0.2 macros internally use cfg(cargo-clippy) — suppress the lint globally for this crate
unexpected_cfgs = "allow"
